<aside id="song-dock" class="song-dock" aria-label="Soft Tide">
  <img src="figure/app_media.png" alt="" class="song-dock-art" />
  <div class="song-dock-meta">
    <strong data-i18n="home.songTitle">Soft Tide</strong>
    <span id="song-dock-status">Soft Tide</span>
    <span id="song-dock-lyric" class="song-dock-lyric">Starting…</span>
    <div class="song-dock-track"><span id="song-dock-bar" class="song-dock-bar-fill"></span></div>
  </div>
  <div class="song-dock-btns">
    <button type="button" class="bevel-btn" data-song-play>▶ Play</button>
    <button type="button" class="bevel-btn" data-song-stop>■</button>
  </div>
</aside>
